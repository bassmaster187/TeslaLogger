name: .NET8 RPI Release

on:
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/NET8'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Get latest version tag
      shell: bash
      run: |
        echo "GIT_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV

    - name: Show latest version tag
      run: |
        echo "GIT_TAG=${{ env.GIT_TAG }}"

    - name: Restore dependencies
      run: dotnet restore TeslaLoggerNET8.sln

    - name: Create output directory
      run: mkdir -p TeslaLogger-master/TeslaLogger/bin/Debug/net8.0

    - name: Remove stale build outputs (force full rebuild)
      run: rm -rf TeslaLogger/bin/Debug TeslaLogger/obj TeslaLogger/bin/x64 TeslaLogger/bin/x86 TLUpdate/bin TLUpdate/obj

    - name: Build TLUpdate (net48 updater for the RPi)
      run: dotnet build TLUpdate/TLUpdate.csproj -c Debug

    - name: Publish for Raspberry Pi (AnyCPU, framework dependent)
      run: dotnet publish TeslaLogger/TeslaLoggerNET8.csproj -c Debug -o ./TeslaLogger-master/TeslaLogger/bin/Debug/net8.0

    - name: Remove unneeded runtimes (keep linux-arm, linux-arm64, unix)
      run: |
        runtimes="TeslaLogger-master/TeslaLogger/bin/Debug/net8.0/runtimes"
        if [ -d "$runtimes" ]; then
          find "$runtimes" -mindepth 1 -maxdepth 1 -type d ! -name 'linux-arm' ! -name 'linux-arm64' ! -name 'unix' -exec rm -rf {} +
        fi

    - name: Checkout OVMSLogger (NET8)
      uses: actions/checkout@v3
      with:
        repository: bassmaster187/OVMSLogger
        ref: NET8
        path: OVMSLogger

    - name: Restore OVMS dependencies
      run: dotnet restore OVMSLogger/OVMS.sln

    - name: Build OVMS
      run: dotnet build --no-restore OVMSLogger/OVMS.sln

    - name: Copy additional files
      run: |
        cp -r TeslaLogger/Grafana TeslaLogger-master/TeslaLogger/
        cp -r TeslaLogger/GrafanaConfig TeslaLogger-master/TeslaLogger/
        cp -r TeslaLogger/GrafanaDashboards13 TeslaLogger-master/TeslaLogger/
        cp -r TeslaLogger/GrafanaPlugins TeslaLogger-master/TeslaLogger/
        cp -r TeslaLogger/www TeslaLogger-master/TeslaLogger/
        cp TeslaLogger/sqlschema.sql TeslaLogger-master/TeslaLogger/
        mkdir -p TeslaLogger-master/MQTTClient
        cp MQTTClient/App.config TeslaLogger-master/MQTTClient/
        mkdir -p TeslaLogger-master/OVMSLogger/bin/Debug
        cp -r OVMSLogger/bin/Debug/net8.0 TeslaLogger-master/OVMSLogger/bin/Debug/
        # only the needed top-level bin files - never the stale checked-in binaries
        # (old TeslaLoggerNET8.dll / TeslaLogger.exe from the mono era would end up in /etc/teslalogger)
        # freshly built TLUpdate (not the stale checked-in one from TeslaLogger/bin)
        cp TLUpdate/bin/Debug/TLUpdate.exe TeslaLogger-master/TeslaLogger/bin/
        cp TeslaLogger/bin/geofence.csv TeslaLogger-master/TeslaLogger/bin/
        cp TeslaLogger/bin/language-*.txt TeslaLogger-master/TeslaLogger/bin/
        cp TeslaLogger/bin/backup.sh TeslaLogger-master/TeslaLogger/bin/
        cp TeslaLogger/bin/changelog.md TeslaLogger-master/TeslaLogger/bin/
        cp TeslaLogger/bin/cleanall.sh TeslaLogger-master/TeslaLogger/bin/
        cp TeslaLogger/bin/multicarfeature.sh TeslaLogger-master/TeslaLogger/bin/
        cp TeslaLogger/bin/osupdate.sh TeslaLogger-master/TeslaLogger/bin/
        cp TeslaLogger/bin/startnet8.sh TeslaLogger-master/TeslaLogger/bin/
        cp TeslaLogger/bin/upgrade2buster.sh TeslaLogger-master/TeslaLogger/bin/

    - name: Create ZIP
      run: |
        cd TeslaLogger-master
        zip -r ../Teslalogger_RPi_${{ env.GIT_TAG }}.zip .

    - name: Rename ZIP
      run: mv Teslalogger_RPi_${{ env.GIT_TAG }}.zip RPI-NET8.zip

    - name: Upload via SFTP
      env:
        SSH_PASS: ${{ secrets.FTP_PASSWORD_TESLALOGGER_DE_UPLOADUSER }}
      run: |
        echo "$SSH_PASS" | sshpass scp -o StrictHostKeyChecking=no RPI-NET8.zip uploaduser@teslalogger.de:upload/

    - name: Update RPI Version via HTTP GET
      run: |
        curl -v "https://teslalogger.de/set_latest_teslalogger_rpi_version.php?apikey=${{ secrets.APIKEY_DOCKER_VERSION }}&version=${{ env.GIT_TAG }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Teslalogger_RPi
        path: RPI-NET8.zip
